# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
 branches:
   include:
     - main
 paths:
   exclude:
     - azure-pipelines.yml
     - README.md
     - '*.png'

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '92421041-2471-4a5e-9fff-a88d63818119'
  imageRepository: 'projectdockerkuberimage'
  containerRegistry: 'dockerregistry20260102.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: 'Deploy Job'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: KubernetesManifest@1
          displayName: 'Create Secret'
          inputs:
            action: 'createSecret'
            connectionType: 'kubernetesServiceConnection'
            kubernetesServiceConnection: 'myAKSconnection'
            namespace: 'default'
            secretType: 'dockerRegistry'
            secretName: 'acr-secret'
            dockerRegistryEndpoint: 'dockerregistry20260102'

        - task: KubernetesManifest@1
          inputs:
            action: 'deploy'
            connectionType: 'kubernetesServiceConnection'
            kubernetesServiceConnection: 'myAKSconnection'
            namespace: 'default'
            manifests: |
              $(System.DefaultWorkingDirectory)/deployment.yaml
              $(System.DefaultWorkingDirectory)/service.yaml
            containers: '$(containerRegistry)/$(imageRepository):$(tag)'

